apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: fullstack-app
data:
  # Backend configuration
  BACKEND_PORT: "5000"
  NODE_ENV: "production"
  
  # Frontend configuration
  FRONTEND_PORT: "3000"
  REACT_APP_API_URL: "http://backend-service:5000/api"
  
  # Application settings
  APP_NAME: "Full-Stack Node.js Application"
  LOG_LEVEL: "info"